[project]
name = "paper-rag"
version = "0.1.0"
description = "RAG backend for an academic-paper reading companion: anchored, figure- and reference-aware, citation-grounded Q&A over paper PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "chromadb>=1.0",
    "google-genai>=1.20",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# src on sys.path directly: keeps `uv run pytest` green even when the
# editable-install .pth is skipped (see PROGRESS.md §6, macOS hidden-flag issue)
pythonpath = ["src"]

[tool.uv]
# rebuild the project wheel when sources change, not only pyproject.toml —
# makes `uv sync --no-editable` workflows safe
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
